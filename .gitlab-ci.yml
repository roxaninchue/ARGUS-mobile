stages:
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'

variables:
  GIT_DEPTH: "20"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

android-unit-tests:
  stage: test
  image: ghcr.io/cirruslabs/android-sdk:34
  timeout: 90m
  cache:
    key:
      files:
        - gradle/wrapper/gradle-wrapper.properties
        - app/build.gradle.kts
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
    policy: pull-push
  script:
    - 'SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"'
    - 'test -n "$SDK_ROOT"'
    - 'printf "sdk.dir=%s\\n" "$SDK_ROOT" > local.properties'
    - 'chmod +x gradlew'
    - './gradlew testReleaseUnitTest :storeapi:test --stacktrace --console=plain "-Dorg.gradle.jvmargs=-Xmx5g -Xss8m -XX:MaxMetaspaceSize=1g" -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.jvm.target.validation.mode=warning'
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - app/build/test-results/testReleaseUnitTest/*.xml
        - storeapi/build/test-results/test/*.xml
    paths:
      - app/build/reports/tests/testReleaseUnitTest/
      - storeapi/build/reports/tests/test/

go-tests:
  stage: test
  image: golang:1.26.10
  timeout: 30m
  script:
    - cd wgproxy
    - go vet ./...
    - go test -count=1 ./...
    - cd ../blazerouter
    - go vet .
    - go test -count=1 ./internal/router/

design-js-tests:
  stage: test
  image: node:22-alpine
  timeout: 15m
  script:
    - node --version
    - node app/src/test/js/design-safe.test.mjs
