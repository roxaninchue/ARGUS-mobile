# Temporary CI for verifying the v0.34.1 optimisation branch (removed before merge).
build:
  image: ghcr.io/cirruslabs/android-sdk:34
  tags: [saas-linux-medium-amd64]
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx3g"
  script:
    - chmod +x gradlew
    - ./gradlew --no-daemon testReleaseUnitTest :storeapi:test assembleRelease
  timeout: 90m
