# Argus GitLab pipeline: PARKED (Finn, 2026-11-23). The free GitLab compute minutes ran out for November (quota
# resets 1 Dec), so the merge gate moved to GitHub Actions on the public push-mirror: .github/workflows/gate.yml, same
# checks, same compile, same :app:testDebugUnitTest. A branch merges into main only when the Gate run for its head
# commit is green on https://github.com/roxaninchue/ARGUS-mobile/actions (AGENTS.md, "Merge rule").
#
# This file creates NO pipeline unless the CI/CD variable ARGUS_GITLAB_CI is "on" (project variable, or set it when
# running a pipeline by hand). That keeps failed ci_quota_exceeded pipelines out of the merge requests. The jobs below
# are kept so GitLab CI can come back with one variable once minutes exist again; they mirror gate.yml.
#
# Jobs: checks (node only: rename guard, do-not-port, design JS tests); build-test (compile, then
# :app:testDebugUnitTest). No APK, screenshot or publish job, no production key, no secrets.
stages: [check, test]

workflow:
  rules:
    # Parked: no pipeline at all unless ARGUS_GITLAB_CI == "on" (see the header).
    - if: $ARGUS_GITLAB_CI != "on"
      when: never
    # Merge request pipelines.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch push while that branch has an open merge request: the MR pipeline above covers it (no double run).
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # Creating a branch (no new commit yet) starts nothing; its first commit or its merge request does.
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000" && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Xss8m -Dfile.encoding=UTF-8"
  # NOTE: the Kotlin daemon stack flag is NOT in this variable. GRADLE_FLAGS is expanded unquoted, and shell word
  # splitting does not honour quotes inside a variable, so -Pkotlin.daemon.jvmargs="-Xmx4g -Xss32m" would arrive as a
  # bare "-X". It is written literally, quoted, at each call site.
  GRADLE_FLAGS: "--no-daemon --console=plain -Pkotlin.jvm.target.validation.mode=warning -Pkotlin.compiler.execution.strategy=in-process --max-workers=2"
  GO_VERSION: "1.26.10"

# ---------------------------------------------------------------- cheap checks (no Android SDK)
checks:
  stage: check
  image: node:22-bookworm-slim
  timeout: 10m
  script:
    - node tools/check-no-blaze.test.mjs
    - node tools/check-no-blaze.mjs
    - node tools/check-do-not-port.mjs
    - node app/src/test/js/design-safe.test.mjs

# ---------------------------------------------------------------- compile + unit tests
build-test:
  stage: test
  image: ghcr.io/cirruslabs/android-sdk:34
  timeout: 90m
  needs: []
  cache:
    key: gradle-gated-1
    paths: [".gradle/caches", ".gradle/wrapper", ".m2/repository/org/robolectric"]
  before_script:
    - |
      set -e
      # JDK 21: the suite needs it (LocalLanguagesTest relies on JDK 20+ grapheme clusters for ZWJ emoji). The project
      # targets 17; the mix is allowed with -Pkotlin.jvm.target.validation.mode=warning.
      JDK21=/usr/lib/jvm/temurin-21-jdk-amd64
      if [ ! -x "$JDK21/bin/javac" ]; then
        echo "Installing Temurin 21"
        apt-get update -qq
        apt-get install -y -qq wget apt-transport-https gnupg ca-certificates >/dev/null
        wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public | gpg --dearmor > /usr/share/keyrings/adoptium.gpg
        . /etc/os-release
        echo "deb [signed-by=/usr/share/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb ${VERSION_CODENAME} main" > /etc/apt/sources.list.d/adoptium.list
        apt-get update -qq
        apt-get install -y -qq temurin-21-jdk >/dev/null
      fi
      if [ ! -x "$JDK21/bin/javac" ]; then echo "Temurin 21 missing; JVMs:"; ls -1 /usr/lib/jvm || true; exit 1; fi
      export JAVA_HOME="$JDK21"
      export PATH="$JAVA_HOME/bin:$PATH"
      java -version 2>&1
      echo "sdk.dir=$ANDROID_HOME" > local.properties
      chmod +x ./gradlew
      echo "--- memory ---"; free -h || true; nproc || true
    - |
      set -e
      # Go builds the two jniLibs the repo gitignores (browser VPN and the router), same loop as gate.yml.
      VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
      J=$PWD/app/src/main/jniLibs
      for D in wgproxy blazerouter; do
        X=""; [ "$D" = wgproxy ] || X="-X main.version=$VER"
        (cd "$D" && CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags "-s -w $X" -o "$J/arm64-v8a/lib$D.so" . \
          && CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w $X" -o "$J/armeabi-v7a/lib$D.so" .)
      done
      ls -la app/src/main/jniLibs/arm64-v8a/
    - |
      set -e
      # Robolectric downloads its Android jars from Maven Central mid-test with no retry; one failed fetch fails every
      # sdk=33 test at once. Fetch them first, with retries, into the cached ~/.m2 Robolectric reads.
      mkdir -p "$CI_PROJECT_DIR/.m2/repository" "$HOME"
      rm -rf "$HOME/.m2"; ln -s "$CI_PROJECT_DIR/.m2" "$HOME/.m2"
      for V in 13-robolectric-9030017-i6 14-robolectric-10818077-i6; do
        D="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$V"; mkdir -p "$D"
        for EXT in pom jar; do
          F="$D/android-all-instrumented-$V.$EXT"
          [ -s "$F" ] && continue
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$F.part" \
            "https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$V/android-all-instrumented-$V.$EXT"
          mv "$F.part" "$F"
        done
      done
  script:
    - |
      export JAVA_HOME=/usr/lib/jvm/temurin-21-jdk-amd64; export PATH="$JAVA_HOME/bin:$PATH"
      set +e
      mkdir -p out
      echo "=== 1/2 compile: app + unit-test sources ==="
      ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin $GRADLE_FLAGS \
        -Pkotlin.daemon.jvmargs="-Xmx4g -Xss32m" > out/compile.log 2>&1
      STATUS=$?
      grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by:|StackOverflow|OutOfMemory" out/compile.log | head -60 || true
      tail -25 out/compile.log
      if [ $STATUS -ne 0 ]; then echo "=== compile FAILED ($STATUS) ==="; exit $STATUS; fi
      echo "=== 2/2 :app:testDebugUnitTest ==="
      ./gradlew :app:testDebugUnitTest --continue $GRADLE_FLAGS \
        -Pkotlin.daemon.jvmargs="-Xmx4g -Xss32m" > out/test.log 2>&1
      STATUS=$?
      echo "=== gradle exit: $STATUS ==="
      grep -nE "^e: |FAILURE:|What went wrong|Caused by:|StackOverflow|OutOfMemory| FAILED$" out/test.log | head -60 || true
      tail -30 out/test.log
      exit $STATUS
  after_script:
    - |
      python3 - > out/units.txt <<'PY' || true
      import glob, xml.etree.ElementTree as ET
      t=f=e=s=0; bad=[]
      for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
          r=ET.parse(p).getroot()
          t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
          for c in r.iter('testcase'):
              if c.find('failure') is not None or c.find('error') is not None:
                  bad.append(c.get('classname')+'.'+c.get('name'))
      print(f"UNITS tests={t} failures={f} errors={e} skipped={s}")
      for b in bad: print("FAIL", b)
      PY
      cat out/units.txt || true
      cp -r app/build/test-results/testDebugUnitTest out/xml 2>/dev/null || true
  artifacts:
    name: "argus-units-$CI_COMMIT_SHORT_SHA"
    when: always
    paths: ["out/"]
    reports:
      junit: app/build/test-results/testDebugUnitTest/*.xml
    expire_in: 1 week
