# 0.49.0 (mem1-ui-browse): a throwaway DEBUG build for testing only.
#
# No release signing, no keystore, no secrets. `assembleDebug` signs with the debug key that the
# Android Gradle plugin generates on the runner, so the APK installs on a test phone and cannot be
# published anywhere. Nothing here touches blazeinchue.pages.dev or the BlazeMobile site.
stages: [build]

debug-apk:
  stage: build
  image: ghcr.io/cirruslabs/android-sdk:34
  rules:
    - if: $CI_COMMIT_BRANCH == "feat/0.49.0-mem1-ui-browse"
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  cache:
    key: gradle-mem1
    paths: [".gradle/caches", ".gradle/wrapper"]
  before_script:
    # The image defaults to JDK 21, but the project's Java target is 17, and Gradle refuses to mix
    # them ("Inconsistent JVM-target compatibility ... 'compileJava' (17) and 'compileKotlin' (21)").
    # Install Temurin 17 and point JAVA_HOME at it by its known path: deriving the path from
    # `which javac` picks up the image's JDK 21 and silently builds on the wrong one.
    - |
      set -e
      JDK17=/usr/lib/jvm/temurin-17-jdk-amd64
      if [ ! -x "$JDK17/bin/javac" ]; then
        echo "Installing Temurin 17"
        apt-get update -qq
        apt-get install -y -qq wget apt-transport-https gnupg ca-certificates >/dev/null
        wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public | gpg --dearmor > /usr/share/keyrings/adoptium.gpg
        . /etc/os-release
        echo "deb [signed-by=/usr/share/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb ${VERSION_CODENAME} main" > /etc/apt/sources.list.d/adoptium.list
        apt-get update -qq
        apt-get install -y -qq temurin-17-jdk >/dev/null
      fi
      if [ ! -x "$JDK17/bin/javac" ]; then
        echo "Temurin 17 not found at $JDK17; available JVMs:"; ls -1 /usr/lib/jvm || true
        exit 1
      fi
      export JAVA_HOME="$JDK17"
      export PATH="$JAVA_HOME/bin:$PATH"
      echo "JAVA_HOME=$JAVA_HOME"
      java -version 2>&1
      javac -version 2>&1
  script:
    - chmod +x ./gradlew
    - ./gradlew :app:assembleDebug --no-daemon --stacktrace
    - mkdir -p out
    - find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
    - ls -la out/
  artifacts:
    name: "blaze-debug-apk-$CI_COMMIT_SHORT_SHA"
    paths: ["out/*.apk"]
    expire_in: 1 week
