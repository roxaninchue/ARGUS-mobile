# 0.51.0 / 0.52.0 verification: unit suite, screenshot/graphics tests, test-signed release APK.
#
# Nothing here signs with the production key, reads keystore/, or publishes anywhere.
# The release APK is signed with a throwaway key generated inside the job, so it installs on a
# test phone and cannot be shipped. No secret is stored in this file or in the repo.
stages: [test, build]

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
  # NOTE: the Kotlin daemon stack flag is NOT in this variable. GRADLE_FLAGS is expanded unquoted,
  # and shell word splitting does not honour quotes inside a variable, so
  # -Pkotlin.daemon.jvmargs="-Xmx4g -Xss32m" would arrive as a bare "-X" and Gradle would reject it
  # ("Unknown command-line option '-X'"). It is written literally, quoted, at each call site.
  GRADLE_FLAGS: "--no-daemon --console=plain -Pkotlin.jvm.target.validation.mode=warning --max-workers=2"
  GO_VERSION: "1.26.10"

.setup: &setup
  image: ghcr.io/cirruslabs/android-sdk:34
  cache:
    key: gradle-051
    paths: [".gradle/caches", ".gradle/wrapper"]
  before_script:
    - |
      set -e
      # JDK 21: the suite needs it (LocalLanguagesTest relies on JDK 20+ grapheme clusters for ZWJ
      # emoji; JDK 17's BreakIterator splits them). The project targets 17, so the 17/21 mix is
      # allowed with -Pkotlin.jvm.target.validation.mode=warning, as the GitHub workflow does.
      JDK21=/usr/lib/jvm/temurin-21-jdk-amd64
      if [ ! -x "$JDK21/bin/javac" ]; then
        echo "Installing Temurin 21"
        apt-get update -qq
        apt-get install -y -qq wget apt-transport-https gnupg ca-certificates >/dev/null
        wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public | gpg --dearmor > /usr/share/keyrings/adoptium.gpg
        . /etc/os-release
        echo "deb [signed-by=/usr/share/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb ${VERSION_CODENAME} main" > /etc/apt/sources.list.d/adoptium.list
        apt-get update -qq
        apt-get install -y -qq temurin-21-jdk >/dev/null
      fi
      if [ ! -x "$JDK21/bin/javac" ]; then echo "Temurin 21 missing; JVMs:"; ls -1 /usr/lib/jvm || true; exit 1; fi
      export JAVA_HOME="$JDK21"
      export PATH="$JAVA_HOME/bin:$PATH"
      java -version 2>&1
      echo "sdk.dir=$ANDROID_HOME" > local.properties
      chmod +x ./gradlew
      echo "--- memory ---"; free -h || true; nproc || true
    - |
      set -e
      # Go builds the two jniLibs the repo gitignores (libwgproxy.so, libblazerouter.so).
      if ! command -v go >/dev/null 2>&1; then
        echo "Installing Go $GO_VERSION"
        wget -q "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -O /tmp/go.tgz
        tar -C /usr/local -xzf /tmp/go.tgz
        export PATH="/usr/local/go/bin:$PATH"
      fi
      go version
      VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
      (cd wgproxy && CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../app/src/main/jniLibs/arm64-v8a/libwgproxy.so . \
        && CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w" -o ../app/src/main/jniLibs/armeabi-v7a/libwgproxy.so .) || echo "wgproxy build skipped"
      (cd blazerouter && CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$VER" -o ../app/src/main/jniLibs/arm64-v8a/libblazerouter.so . \
        && CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w -X main.version=$VER" -o ../app/src/main/jniLibs/armeabi-v7a/libblazerouter.so .) || echo "blazerouter build skipped"
      ls -la app/src/main/jniLibs/arm64-v8a/ || true

# ---------------------------------------------------------------- unit suite
unit-tests:
  <<: *setup
  stage: test
  timeout: 2h
  rules:
    - if: $CI_COMMIT_BRANCH == "feat/blaze-0.51"
    - if: $CI_COMMIT_BRANCH == "feat/blaze-0.52"
    - if: $CI_COMMIT_BRANCH == "sync/github-main-4ea1acd1"
  script:
    - |
      set +e
      # Scrubed copy: gateway/, keystore/, HANDOFF*.md and STATUS.md are private paths the GitHub
      # mirror never carries. OwnerName19Test and UpdateKeysTest scan the tree and fail on them by
      # design (docs/BUILD-LOCAL.md), so the documented local procedure leaves them out. This is not
      # a test change: the same suite runs, on the same code.
      # tar, not rsync: the android-sdk image has no rsync.
      mkdir -p /tmp/bb
      tar -cf - --exclude='./.git' --exclude='./build' --exclude='./app/build' --exclude='./.gradle' \
        --exclude='./gateway' --exclude='./keystore' --exclude='./HANDOFF.md' --exclude='./HANDOFF-gallery.md' \
        --exclude='./docs/HANDOFF-0.52.md' \
        --exclude='./STATUS.md' --exclude='./.github' . | tar -xf - -C /tmp/bb
      cd /tmp/bb
      ls -la | head -20
      ./gradlew :app:testDebugUnitTest --continue $GRADLE_FLAGS \
        -Pkotlin.daemon.jvmargs="-Xmx4g -Xss32m" > test.log 2>&1
      STATUS=$?
      echo "=== gradle exit: $STATUS ==="
      grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by:|StackOverflow|OutOfMemory" test.log | head -40 || true
      tail -30 test.log
      exit $STATUS
  after_script:
    - |
      cd /tmp/bb 2>/dev/null || exit 0
      python3 - > units.txt <<'PY'
      import glob, xml.etree.ElementTree as ET
      t=f=e=s=0; bad=[]
      for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
          r=ET.parse(p).getroot()
          t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
          for c in r.iter('testcase'):
              if c.find('failure') is not None or c.find('error') is not None:
                  bad.append(c.get('classname')+'.'+c.get('name'))
      print(f"UNITS tests={t} failures={f} errors={e} skipped={s}")
      for b in bad: print("FAIL", b)
      PY
      cat units.txt
      mkdir -p "$CI_PROJECT_DIR/out"
      cp units.txt "$CI_PROJECT_DIR/out/" 2>/dev/null || true
      cp test.log "$CI_PROJECT_DIR/out/" 2>/dev/null || true
      cp -r app/build/test-results/testDebugUnitTest "$CI_PROJECT_DIR/out/xml" 2>/dev/null || true
  artifacts:
    name: "blaze-units-$CI_COMMIT_SHORT_SHA"
    when: always
    paths: ["out/"]
    expire_in: 1 week

# ---------------------------------------------------------------- screenshot / graphics tests
shots:
  <<: *setup
  stage: test
  timeout: 2h
  rules:
    - if: $CI_COMMIT_BRANCH == "feat/blaze-0.51"
    - if: $CI_COMMIT_BRANCH == "feat/blaze-0.52"
    - if: $CI_COMMIT_BRANCH == "sync/github-main-4ea1acd1"
  variables:
    BLAZE_SHOTS: "1"
  script:
    - |
      set +e
      # The runner is x86-64, so Robolectric 4.13's NATIVE graphics runtime is available directly.
      # No qemu-user and no aarch64 workaround: the drawing tests run natively here.
      ./gradlew :app:testDebugUnitTest \
        --tests 'com.blaze.assistant.ui.ShotsTest' \
        --tests 'com.blaze.assistant.ui.Shots375Test' \
        --tests 'com.blaze.assistant.ui.StageShotsTest' \
        --tests 'com.blaze.assistant.ui.MoviesShotsTest' \
        --tests 'com.blaze.assistant.ui.MediaRevampShotsTest' \
        --tests 'com.blaze.assistant.ui.SecretCardsShotsTest' \
        --tests 'com.blaze.assistant.ui.HomeRedesignShotsTest' \
        --tests 'com.blaze.assistant.ui.ComposerShotsTest' \
        --tests 'com.blaze.assistant.ui.Blaze050ShotsTest' \
        --tests 'com.blaze.assistant.ui.RichMediaShotsTest' \
        --continue $GRADLE_FLAGS \
        -Pkotlin.daemon.jvmargs="-Xmx4g -Xss32m" > shots.log 2>&1
      STATUS=$?
      echo "=== gradle exit: $STATUS ==="
      grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by:|StackOverflow|OutOfMemory" shots.log | head -40 || true
      tail -30 shots.log
      exit $STATUS
  after_script:
    - |
      python3 - > shots.txt <<'PY'
      import glob, xml.etree.ElementTree as ET
      t=f=e=s=0; bad=[]
      for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
          r=ET.parse(p).getroot()
          t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
          for c in r.iter('testcase'):
              if c.find('failure') is not None or c.find('error') is not None:
                  bad.append(c.get('classname')+'.'+c.get('name'))
      print(f"SHOTS tests={t} failures={f} errors={e} skipped={s}")
      for b in bad: print("FAIL", b)
      PY
      cat shots.txt
      mkdir -p "$CI_PROJECT_DIR/out"
      cp shots.txt "$CI_PROJECT_DIR/out/" 2>/dev/null || true
      cp shots.log "$CI_PROJECT_DIR/out/" 2>/dev/null || true
      (cd app/build && zip -qr "$CI_PROJECT_DIR/out/shots.zip" shots) 2>/dev/null || true
      ls -la "$CI_PROJECT_DIR/out" || true
  artifacts:
    name: "blaze-shots-$CI_COMMIT_SHORT_SHA"
    when: always
    paths: ["out/"]
    expire_in: 1 week

# ---------------------------------------------------------------- release APK (test key)
release-apk:
  <<: *setup
  stage: build
  timeout: 2h
  # Built regardless of the test stage: a red unit suite must not hide the APK.
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "feat/blaze-0.51"
    - if: $CI_COMMIT_BRANCH == "feat/blaze-0.52"
    - if: $CI_COMMIT_BRANCH == "sync/github-main-4ea1acd1"
  script:
    - |
      set +e
      ./gradlew :app:assembleRelease $GRADLE_FLAGS \
        -Pkotlin.daemon.jvmargs="-Xmx4g -Xss32m" > rel.log 2>&1
      STATUS=$?
      echo "=== gradle exit: $STATUS ==="
      grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by:|StackOverflow|OutOfMemory" rel.log | head -40 || true
      tail -30 rel.log
      if [ $STATUS -ne 0 ]; then mkdir -p out; cp rel.log out/; exit $STATUS; fi

      VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
      VC=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
      echo "version=$VER versionCode=$VC"
      mkdir -p out
      BT="$ANDROID_HOME/build-tools/34.0.0"
      UNSIGNED=$(ls app/build/outputs/apk/release/*-unsigned.apk | head -1)
      echo "unsigned: $UNSIGNED"
      "$BT/zipalign" -f -p 4 "$UNSIGNED" out/aligned.apk
      "$BT/zipalign" -c -p 4 out/aligned.apk && echo "zipalign -p 4: ok"

      # Throwaway key, generated here and thrown away with the container. keystore/ in the repo is
      # never read, and no password is stored anywhere.
      keytool -genkeypair -keystore /tmp/test.p12 -storetype PKCS12 \
        -storepass testonly -keypass testonly -alias test \
        -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Blaze test" 2>&1 | tail -2
      APK="out/Blaze-v${VER}-vc${VC}-test-signed.apk"
      java -jar "$BT/lib/apksigner.jar" sign --ks /tmp/test.p12 --ks-pass pass:testonly \
        --out "$APK" out/aligned.apk
      java -jar "$BT/lib/apksigner.jar" verify --print-certs "$APK" | head -8
      "$BT/aapt2" dump badging "$APK" > out/badging.txt 2>&1 || true
      grep -E "package:|sdkVersion|targetSdkVersion" out/badging.txt || true
      if grep -q "application-debuggable" out/badging.txt; then echo "ERROR: debuggable"; exit 1; fi
      rm -f out/aligned.apk
      (cd out && sha256sum *.apk | tee SHA256SUMS)
      ls -la out/
      echo "${CI_COMMIT_SHA}" > out/COMMIT
      cp rel.log out/

      # Generic package registry. Uses the job token: no stored credential.
      echo "=== package registry upload ==="
      for f in out/*.apk out/SHA256SUMS; do
        code=$(curl -sS -o /tmp/up.txt -w '%{http_code}' --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$f" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/blaze-android/${VER}/$(basename "$f")")
        echo "upload $(basename "$f") -> HTTP $code"
        [ "$code" = "201" ] || [ "$code" = "200" ] || cat /tmp/up.txt
      done
  artifacts:
    name: "blaze-release-apk-$CI_COMMIT_SHORT_SHA"
    when: always
    paths: ["out/"]
    expire_in: 1 month
