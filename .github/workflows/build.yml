name: Build APK

on:
  push:
    # 0.52.2: the ARGUS living 3D Home branch builds and tests here too (it never publishes: the publish steps are main-only).
    # 0.52.3: + the ARGUS x Hark design branch (same rules: tests, shots, a test-signed APK, never published).
    # 2026-11-19: + the package rename branch (owner: "build"; same rules, never published, never release-key signed).
    branches: [main, feat/argus-3d-home, feat/argus-hark-design, feat/argus-rename]
    # The Blaze Gateway Worker (gateway/) has its own workflow; changes only there don't rebuild the app.
    paths-ignore: ['gateway/**', '.github/workflows/gateway.yml', '**/*.md', 'docs/**']
  # Pull requests (including from forks) only build; they never publish, sign a release or edit issues.
  pull_request:
    branches: [main]
    paths-ignore: ['gateway/**', '.github/workflows/gateway.yml']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the publishing steps below run with write access, and only on this repo's main.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches wrapper, dependencies AND the build cache, with fallback restore (the old key went cold on any .gradle.kts edit).
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/feat/argus-3d-home' && github.ref != 'refs/heads/feat/argus-hark-design' && github.ref != 'refs/heads/feat/argus-rename' }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: blazerouter/go.mod
          cache-dependency-path: |
            wgproxy/go.sum
            blazerouter/go.sum

      # The browser VPN engine: user-space WireGuard + local HTTP proxy, shipped as an executable lib*.so
      # (like the Needle runner) so Android unpacks it into nativeLibraryDir.
      - name: Build wgproxy (browser VPN)
        working-directory: wgproxy
        run: |
          go vet ./...
          go test -count=1 ./...
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../app/src/main/jniLibs/arm64-v8a/libwgproxy.so .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w" -o ../app/src/main/jniLibs/armeabi-v7a/libwgproxy.so .
          ls -la ../app/src/main/jniLibs/*/libwgproxy.so

      # BlazeRouter (Desktop's router, Go port of OmniRoute, MIT): same trick, libblazerouter.so,
      # started by Blaze in Alpine, Termux or directly (agent/BlazeRouter.kt).
      - name: Build BlazeRouter
        working-directory: blazerouter
        run: |
          go vet .
          go test -count=1 ./internal/router/
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$(grep -oP 'versionName = "\K[^"]+' ../app/build.gradle.kts)" -o ../app/src/main/jniLibs/arm64-v8a/libblazerouter.so .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w -X main.version=$(grep -oP 'versionName = "\K[^"]+' ../app/build.gradle.kts)" -o ../app/src/main/jniLibs/armeabi-v7a/libblazerouter.so .
          ls -la ../app/src/main/jniLibs/*/libblazerouter.so

      # v0.23.5: the three.js safety net and the 3D starter survive bad objects (node is preinstalled on ubuntu-latest).
      - name: Design JS tests
        run: node app/src/test/js/design-safe.test.mjs

      # Blaze → Argus rename guard (docs/RENAME-ARGUS-PLAN.md): no new "blaze" outside tools/rename/keep-blaze.txt;
      # counts may only go down (tools/rename/baseline.json is the ratchet).
      - name: Rename guard (no new blaze)
        run: |
          node tools/check-no-blaze.test.mjs
          node tools/check-no-blaze.mjs

      # The YouTube plug-in (Gradle :youtube) is REQUIRED (owner, 2026-11-19): there is no build without it. Since
      # 2026-11-19 it lives in this repo (youtube/, rebuilt in-repo), so it comes with the checkout above: no secret,
      # no second checkout. Its tests run with the build below (:youtube:test).

      # 2026-11-19: Robolectric downloads its Android jars from Maven Central while the tests run, with no retry. One failed
      # fetch (run on b4de2eaf: android-all-instrumented 13-...-i6, .pom not found) failed all 142 sdk=33 tests at once.
      # Fetch them here first, with retries, into ~/.m2 (where Robolectric looks before downloading) and cache them.
      - name: Cache Robolectric Android jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-android-all-4.13-33-34

      - name: Pre-fetch Robolectric Android jars
        run: |
          for V in 13-robolectric-9030017-i6 14-robolectric-10818077-i6; do
            D=~/.m2/repository/org/robolectric/android-all-instrumented/$V; mkdir -p "$D"
            for EXT in pom jar; do
              F="$D/android-all-instrumented-$V.$EXT"
              [ -s "$F" ] && continue
              curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$F.part" \
                "https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$V/android-all-instrumented-$V.$EXT"
              mv "$F.part" "$F"
            done
            ls -la "$D"
          done

      - name: Build release APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          # v0.30.5: the Jamendo Store's client_id ships inside the APK (BuildConfig.JAMENDO_CLIENT_ID) when this secret is set.
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set -o pipefail
          ./gradlew testReleaseUnitTest :storeapi:test :youtube:test assembleRelease --stacktrace 2>&1 | tee build.log

      # 2026-11-14: the failure log, as an artifact anyone can fetch (job logs need a token; Post failure log runs only upstream)
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog-${{ github.sha }}
          path: |
            build.log
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Key rotation (v1.14.2+): v1/v2 stay on the old key for Android 8, v3 moves to the new key with a lineage
      # for Android 9+. The old key keeps installed-data (so current installs update) but loses rollback,
      # permission, shared-uid and auth, so an APK signed only with the old (public) key can't replace a rotated install.
      # The new key lives only in Actions secrets; PR builds never see it.
      - name: Rotate signing key
        # 0.52.2: never on the feat/argus-3d-home test branch (its APK is test-signed below, never with a release key); 0.52.3: nor feat/argus-hark-design; 2026-11-19: nor feat/argus-rename
        if: github.event_name != 'pull_request' && github.repository == format('{0}{1}{2}{3}/Blaze-agent', 'lack', 'son', 'kap', 'apahue') && github.ref != 'refs/heads/feat/argus-3d-home' && github.ref != 'refs/heads/feat/argus-hark-design' && github.ref != 'refs/heads/feat/argus-rename'
        env:
          NEW_P12: ${{ secrets.BLAZE_SIGNING_P12 }}
          NEW_PASS: ${{ secrets.BLAZE_SIGNING_PASS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SIGNER="$BT/apksigner"
          umask 077; mkdir -p "$RUNNER_TEMP/k"; K="$RUNNER_TEMP/k"
          DRY=""
          if [ -z "$NEW_P12" ] || [ -z "$NEW_PASS" ]; then
            echo "::warning::BLAZE_SIGNING_P12 / BLAZE_SIGNING_PASS not set; this build stays on the old key. Dry-running the rotation with a throwaway key."
            DRY=1; NEW_PASS=dryrunpass; export NEW_PASS
            keytool -genkeypair -keystore "$K/new.p12" -storetype PKCS12 -alias blaze -keyalg RSA -keysize 2048 -validity 1 \
              -dname "CN=dry" -storepass "$NEW_PASS" -keypass "$NEW_PASS" >/dev/null
          else
            echo "$NEW_P12" | base64 -d > "$K/new.p12"
          fi
          export OLD_PASS=android
          "$SIGNER" rotate --out "$K/lineage" \
            --old-signer --ks keystore/blaze.keystore --ks-key-alias androiddebugkey --ks-pass env:OLD_PASS --key-pass env:OLD_PASS \
              --set-installed-data true --set-rollback false --set-permission false --set-shared-uid false --set-auth false \
            --new-signer --ks "$K/new.p12" --ks-type PKCS12 --ks-key-alias blaze --ks-pass env:NEW_PASS --key-pass env:NEW_PASS
          for APK in app/build/outputs/apk/release/*.apk; do
            if [ -n "$DRY" ]; then cp "$APK" "$K/dry.apk"; APK="$K/dry.apk"; fi
            "$SIGNER" sign --ks keystore/blaze.keystore --ks-key-alias androiddebugkey --ks-pass env:OLD_PASS --key-pass env:OLD_PASS \
              --next-signer --ks "$K/new.p12" --ks-type PKCS12 --ks-key-alias blaze --ks-pass env:NEW_PASS --key-pass env:NEW_PASS \
              --lineage "$K/lineage" --rotation-min-sdk-version 28 "$APK"
            "$SIGNER" verify --print-certs -v "$APK" | grep -E "Verified using|Signer|SHA-256" | head -20
          done
          rm -rf "$K"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blaze-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # 2026-11-19: every build also ships a debug-signed copy, ready to install (zipaligned, v2+v3). The key is the public
      # debug key in keystore/ci-debug.keystore (alias androiddebugkey, password android), so each build installs over the last.
      # The unsigned APK above is unchanged; the release-key steps are untouched.
      - name: Debug-signed APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          SHORT=$(echo "${{ github.sha }}" | cut -c1-8)
          mkdir -p debug-signed
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$SRC" debug-signed/aligned.apk
          "$BT/apksigner" sign --ks keystore/ci-debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
            --out "debug-signed/ARGUS-v${VER}-${SHORT}-debug-signed.apk" debug-signed/aligned.apk
          rm -f debug-signed/aligned.apk debug-signed/*.idsig
          "$BT/apksigner" verify --print-certs "debug-signed/ARGUS-v${VER}-${SHORT}-debug-signed.apk" | head -3

      - name: Upload debug-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: argus-debug-signed-${{ github.sha }}
          path: debug-signed/*.apk
          retention-days: 14

      # 0.54.2: the R8 map, so a STALL / CRASH stack from a phone report (x4.L2.z0…) can be read back as real names.
      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90

      # Preview screenshots (Robolectric, ui/ShotsTest). 0.53.2: only on a commit/PR titled with [shots] or a manual run, and after
      # the APK upload, so the APK never waits ~6 min on pictures. Never blocks a release; the PNGs and the log go to the `shots` branch.
      - name: Screenshots
        id: shots
        if: (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shots]') || contains(github.event.pull_request.title, '[shots]'))
        continue-on-error: true
        run: |
          set -o pipefail
          BLAZE_SHOTS=1 ./gradlew testDebugUnitTest --tests 'com.argus.assistant.ui.ShotsTest*' --tests 'com.argus.assistant.ui.SpaceShotsTest' --tests 'com.argus.assistant.ui.shots.P1ShotsTest' --stacktrace 2>&1 | tee shots.log
          ls -la app/build/shots

      # P1-QA-01: the P1 shots matrix (204 PNGs under app/build/shots/P1ShotsTest/) as an artifact, so it can be reviewed on any repo.
      - name: Upload screenshots
        if: always() && steps.shots.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ github.sha }}
          path: |
            app/build/shots/
            shots.log
          if-no-files-found: ignore

      - name: Publish screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        if: always() && steps.shots.outcome != 'skipped' && github.repository == format('{0}{1}{2}{3}/Blaze-agent', 'lack', 'son', 'kap', 'apahue') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          mkdir -p /tmp/shots
          cp app/build/shots/*.png /tmp/shots/ 2>/dev/null || true
          { grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log 2>/dev/null | head -120; echo '----- tail -----'; tail -40 build.log 2>/dev/null; } > /tmp/shots/build.log
          { echo "outcome: ${{ steps.shots.outcome }}  sha: ${{ github.sha }}  ref: ${{ github.head_ref || github.ref_name }}"; grep -E "^e: |FAILED|Exception|What went wrong" -A4 shots.log 2>/dev/null | head -80; echo '----- tail -----'; tail -60 shots.log 2>/dev/null; } > /tmp/shots/shots.log
          cd /tmp/shots
          git init -q -b shots
          git config user.name "Blaze CI"; git config user.email "ci@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add -A && git commit -qm "Screenshots ${{ github.sha }}"
          if ! git push origin shots --force > /tmp/push.log 2>&1; then
            sed 's/x-access-token:[^@]*@/x-access-token:***@/g' /tmp/push.log | gh issue comment 1 --repo ${{ github.repository }} --body-file - || true
            exit 1
          fi

      # 0.52.2: a TEST-signed copy of this build for phones (throwaway key made here, like lowram-smoke.yml). Never published:
      # a phone with the real ARGUS must uninstall it first (the signatures differ). The release key is never used here.
      - name: Test-signed APK (throwaway key, install only)
        if: github.ref == 'refs/heads/feat/argus-3d-home' || github.head_ref == 'feat/argus-3d-home' || github.ref == 'refs/heads/feat/argus-hark-design' || github.head_ref == 'feat/argus-hark-design' || github.ref == 'refs/heads/feat/argus-rename' || github.head_ref == 'feat/argus-rename'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p test-signed
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$SRC" test-signed/aligned.apk
          keytool -genkeypair -keystore ci-test.p12 -storetype PKCS12 -storepass testonly -keypass testonly -alias test -keyalg RSA -keysize 2048 -validity 7 -dname "CN=ARGUS test build"
          "$BT/apksigner" sign --ks ci-test.p12 --ks-pass pass:testonly --out "test-signed/ARGUS-v${VER}-test-signed.apk" test-signed/aligned.apk
          "$BT/apksigner" verify --print-certs "test-signed/ARGUS-v${VER}-test-signed.apk" | head -3
          rm -f test-signed/aligned.apk ci-test.p12
          (cd test-signed && sha256sum *.apk | tee SHA256SUMS)

      - name: Upload test-signed APK
        if: github.ref == 'refs/heads/feat/argus-3d-home' || github.head_ref == 'feat/argus-3d-home' || github.ref == 'refs/heads/feat/argus-hark-design' || github.head_ref == 'feat/argus-hark-design' || github.ref == 'refs/heads/feat/argus-rename' || github.head_ref == 'feat/argus-rename'
        uses: actions/upload-artifact@v4
        with:
          # 0.52.3: argus-hark-design-test-signed-<sha> on feat/argus-hark-design; 2026-11-19: argus-rename-test-signed-<sha> on feat/argus-rename
          name: ${{ (github.ref == 'refs/heads/feat/argus-hark-design' || github.head_ref == 'feat/argus-hark-design') && 'argus-hark-design' || ((github.ref == 'refs/heads/feat/argus-rename' || github.head_ref == 'feat/argus-rename') && 'argus-rename' || 'argus-3d-home') }}-test-signed-${{ github.sha }}
          path: test-signed/
          retention-days: 14

      - name: Publish APK to apk branch
        if: github.event_name != 'pull_request' && github.repository == format('{0}{1}{2}{3}/Blaze-agent', 'lack', 'son', 'kap', 'apahue') && github.ref == 'refs/heads/main'
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          mkdir -p /tmp/out && cp "$APK" "/tmp/out/Blaze-v$VER.apk"
          # Bridge copy (v0.8.0 renumbered 1.x -> 0.x): older Blazes compare names and need one that sorts
          # above 1.17.0; v0.8.0+ reads the build number from it. Same APK, same signature.
          cp "$APK" "/tmp/out/Blaze-v1.999.$CODE.apk"
          cd /tmp/out
          git init -q -b apk
          git config user.name "Blaze CI"; git config user.email "ci@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          echo "$VER ${{ github.sha }} $CODE" > LATEST
          git add -A && git commit -qm "Blaze v$VER (${{ github.sha }})" && git push -q origin apk --force

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && github.repository == format('{0}{1}{2}{3}/Blaze-agent', 'lack', 'son', 'kap', 'apahue') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          F="/tmp/out/Blaze-v$VER.apk"
          NOTES=$(git log -1 --format=%s ${{ github.sha }})
          if gh release view "v$VER" --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release upload "v$VER" "$F" --clobber --repo ${{ github.repository }}
          else
            gh release create "v$VER" "$F" --repo ${{ github.repository }} --target ${{ github.sha }} --title "Blaze v$VER" --notes "$NOTES" --latest
          fi

      - name: Post failure log
        if: failure() && github.repository == format('{0}{1}{2}{3}/Blaze-agent', 'lack', 'son', 'kap', 'apahue') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Steps: ${{ join(steps.*.outcome, ', ') }}"; echo "Build failed on ${{ github.sha }} (run ${{ github.run_id }})"; echo; echo '```'; grep -E "^e: |error:|FAILURE|What went wrong| FAILED$" -A6 build.log 2>/dev/null | head -160; echo '----- tail -----'; tail -80 build.log 2>/dev/null || echo "no build.log (failed before Gradle ran)"; echo '```'; } > comment.md
          gh issue edit 1 --repo ${{ github.repository }} --body-file comment.md

  # The android-app-builder skill's template must keep building: make a project from it exactly as
  # Blaze does on the phone (setup.sh), then build it like its own workflow would.
  app-template:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build an app from the skill template
        env:
          BUILD_NUMBER: '7'
        run: |
          sh app/src/main/assets/skills/android-app-builder/setup.sh /tmp/demo com.blaze.demo "Blaze Demo's App"
          cd /tmp/demo
          test -f .github/workflows/build.yml && test -f .gitignore
          mkdir -p keystore
          keytool -genkeypair -keystore keystore/release.jks -alias app -keyalg RSA -keysize 2048 -validity 1 -dname "CN=ci" -storepass blazeapp -keypass blazeapp
          ./gradlew assembleRelease --stacktrace
          ls -la app/build/outputs/apk/release/
