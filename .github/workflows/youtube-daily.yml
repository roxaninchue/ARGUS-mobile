name: YouTube plug-in daily

# Daily: build the default branch with the in-repo YouTube plug-in (youtube/, Gradle :youtube; rebuilt in this repo on 2026-11-19)
# so drift between the plug-in and :storeapi / the app shows up within a day, then run the plug-in's LIVE smoke test
# against YouTube (search must answer; the player/stream check is a warning only, because data-centre runners often
# get YouTube's bot check). No secret needed. Runs on this public repo's free Actions minutes. Publishes nothing.
# The plug-in is required (owner, 2026-11-19): a red run opens the issue below.
on:
  schedule:
    - cron: '47 4 * * *'   # daily 04:47 UTC (06:47 Zambia)
  workflow_dispatch:

concurrency:
  group: youtube-daily
  cancel-in-progress: true

permissions:
  contents: read

env:
  ISSUE_TITLE: YouTube plug-in daily check failing

jobs:
  check:
    # The old upstream repo and the public GitHub mirror of the GitLab repo (where builds run since 2026-11-19).
    if: github.repository == format('{0}{1}{2}{3}/Blaze-agent', 'lack', 'son', 'kap', 'apahue') || github.repository == 'roxaninchue/ARGUS-mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      # Scheduled runs use the default branch; a manual run uses the branch it was started on.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ytdaily-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-ytdaily-

      - name: Plug-in tests + release APK with the plug-in
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "### ${GITHUB_REF_NAME} @ $(git rev-parse --short HEAD) (YouTube plug-in in youtube/)" >> "$GITHUB_STEP_SUMMARY"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set -o pipefail
          ./gradlew :storeapi:test :youtube:test :app:testReleaseUnitTest --tests 'com.argus.assistant.mediaapps.*' :app:assembleRelease --stacktrace 2>&1 | tee build.log
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p /tmp/dex && unzip -o -q "$APK" 'classes*.dex' -d /tmp/dex
          if ! grep -a -q "Lcom/argus/assistant/mediaapps/youtube/YouTubeSource;" /tmp/dex/*.dex; then
            echo "::error::YouTubeSource is missing from the APK (R8 keep rule or wiring broken)"; exit 1
          fi
          echo "### OK: plug-in tests pass and YouTubeSource is in the release APK" >> "$GITHUB_STEP_SUMMARY"

      # Live: real YouTube search (must work) and a stream check on a Creative Commons video (warning only; set
      # YT_LIVE_STRICT=1 to make a refused player fail the run).
      - name: YouTube live smoke (no secret)
        run: |
          set -o pipefail
          YT_LIVE=1 ./gradlew :youtube:test --tests 'com.argus.assistant.mediaapps.youtube.YouTubeLiveSmokeTest' 2>&1 | tee smoke.log
          { echo "### Live smoke"; grep -o 'YT-SMOKE.*' smoke.log | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'YT-SMOKE WARNING' smoke.log; then echo "::warning title=YouTube streams::$(grep -o 'YT-SMOKE WARNING.*' smoke.log | head -1)"; fi

      - name: Open, update or close the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          NUM=$(gh issue list --repo "$REPO" --state open --search "\"$ISSUE_TITLE\" in:title" --json number,title \
                --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")
          if [ "$OUTCOME" != success ]; then
            BODY="The daily build of \`main\` with the in-repo YouTube plug-in (youtube/) failed on $(date -u +%F): $RUN_URL
          Either the plug-in no longer matches \`:storeapi\` / the app, or YouTube search changed (live smoke test).
          Until fixed, builds and releases from \`main\` fail too (the plug-in is required; there is no build without it)."
            if [ -n "$NUM" ]; then gh issue comment "$NUM" --repo "$REPO" --body "$BODY"
            else gh issue create --repo "$REPO" --title "$ISSUE_TITLE" --body "$BODY"; fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --repo "$REPO" --comment "Green again: $RUN_URL"
          fi
