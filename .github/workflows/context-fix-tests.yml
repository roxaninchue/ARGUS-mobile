# Temporary (2026-11-19): runs the Robolectric classes (plus the context tests) on x86 for fix/context-loss, since 55 Robolectric
# tests cannot start on the aarch64 machine the fixes were tested on. Not merged to main.
name: Context fix tests
on:
  push:
    branches: [fix/context-loss]
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit suite
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests '*.InstallSheetTest' --tests '*.TeamDbTest' --tests '*.BackRuleWindowTest' --tests '*.HomeFocusTest' --tests '*.HomeRedesignTest' --tests '*.KitShotsTest' --tests '*.LifeShotsTest' --tests '*.TeamShotsTest' --tests '*.CardsShotsTest' --tests '*.ThreadShotsTest' --tests '*.ContextLossTest' --tests '*.RequestBudgetTest' --tests '*.TieredMemoryTest' --tests '*.AutoCompactTest' --tests '*.VaguePromptTest' --continue --no-daemon --console=plain -Pkotlin.jvm.target.validation.mode=warning \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Xss32m -Dfile.encoding=UTF-8" 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}
      - name: Failed tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as E
          tot = bad = 0
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              for tc in E.parse(f).getroot().iter('testcase'):
                  tot += 1
                  if tc.find('failure') is not None or tc.find('error') is not None:
                      bad += 1; print('FAILED', tc.get('classname'), tc.get('name'))
          print(f'{tot} tests, {bad} failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
