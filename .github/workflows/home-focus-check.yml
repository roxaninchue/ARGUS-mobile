# Local check (not the release gate) on the same low-RAM emulator as lowram-smoke.yml, with animations ON (the gate disables
# them), same 700 ms main-stall limit. 0.52.2: the old Home's card focus (HomeFocusCheck) and screenshots (Rc4ShotsCheck)
# are gone with the old Home. 0.52.3: this runs SpaceHomeCheck: the ARGUS x Hark shell (space view, top bar, the Home's
# cards, the profile page, Projects) in dark and light, with a screenshot of each screen (ArgusHomeCheck left with the 3D Home). The official gate
# (LowRamSmokeTest, 7 scenarios) is separate. File name kept so existing links / required checks still match.
name: Home focus check (ARGUS Home, space shell)

on:
  push:
    branches: [ "check/**", "feat/argus-3d-home", "feat/argus-hark-design", "chore/**" ]
    # Docs-only pushes (BUILDING.md, notes) don't start a 25-minute round.
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-focus-check-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Build debug app + test APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain "-Dorg.gradle.jvmargs=-Xmx5g -Xss8m -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.jvm.target.validation.mode=warning 2>&1 | tee build-focus.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-31-google_apis-x86_64-1536M-v1
      - name: Create AVD snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          ram-size: 1536M
          heap-size: 192M
          disk-size: 6G
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: echo "AVD snapshot generated"
      - name: Low-RAM emulator (API 31, 1.5 GB RAM, 192 MB heap), animations on
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          ram-size: 1536M
          heap-size: 192M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot-save
          force-avd-creation: false
          disable-animations: false
          script: |
            mkdir -p focus-out
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk > focus-out/install.txt 2>&1
            adb install -r -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk >> focus-out/install.txt 2>&1
            adb logcat -c
            timeout 1500 adb shell am instrument -w -r -e class com.blazeinchue.argus.smoke.SpaceHomeCheck com.blazeinchue.argus.test/androidx.test.runner.AndroidJUnitRunner > focus-out/instrument.txt 2>&1 || true
            adb logcat -d -v threadtime > focus-out/logcat.txt
            echo "# ARGUS Home check (space shell)" > focus-out/SUMMARY.md
            grep -E "OK \(|FAILURES|Tests run|shortMsg|stack=" focus-out/instrument.txt | head -20 | tee -a focus-out/SUMMARY.md
            grep -E "ArgusSpaceHome" focus-out/logcat.txt | sed -E 's/^.*(ArgusSpaceHome): /  /' | tee -a focus-out/SUMMARY.md
            # a screenshot of every screen, dark and light
            adb pull /sdcard/Android/data/com.blazeinchue.argus/files/space focus-out/space > /dev/null 2>&1 || echo "no ARGUS screenshots" >> focus-out/SUMMARY.md
            echo "- screenshots: $(ls focus-out/space 2>/dev/null | wc -l)" | tee -a focus-out/SUMMARY.md
            grep -q "^OK (1 test)" focus-out/instrument.txt
      - name: Summary
        if: always()
        run: cat focus-out/SUMMARY.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focus-out
          retention-days: 7
          # 0.52.2: + the debug APK of this commit (debug-signed: a test build for phones, never published)
          path: |
            focus-out/
            app/build/outputs/apk/debug/app-debug.apk
