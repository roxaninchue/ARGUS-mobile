name: Release APK

# Attaches the APK built by a Build APK run to a GitHub Release (created on the given commit when missing).
# Run by hand (workflow_dispatch); uses only the workflow's own GITHUB_TOKEN.
# 0.52.2: manual by design, so no branch trigger for feat/argus-3d-home; instead a run of that branch can hand over its
# TEST-signed artifact (artifact: argus-3d-home-test-signed-<sha>, from build.yml) as a PRE-release (never "latest"),
# so testers get an installable 0.52.2 build without the release key ever touching it.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build APK run id whose artifact to publish'
        required: true
      tag:
        description: 'Release tag, e.g. v0.33.2'
        required: true
      sha:
        description: 'Commit the tag points at (when the release does not exist yet)'
        required: true
      asset:
        description: 'File name for the APK on the release'
        required: true
      title:
        description: 'Release title'
        required: false
        default: ''
      artifact:
        description: 'Only this artifact of the run (e.g. argus-3d-home-test-signed-<sha>); empty = the first APK of any artifact'
        required: false
        default: ''
      prerelease:
        description: 'Publish as a pre-release (test builds, e.g. feat/argus-3d-home); never marked latest'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Download the run's APK
        run: |
          if [ -n "${{ inputs.artifact }}" ]; then gh run download "${{ inputs.run_id }}" --repo "$REPO" --dir art --name "${{ inputs.artifact }}"
          else gh run download "${{ inputs.run_id }}" --repo "$REPO" --dir art; fi
          APK=$(find art -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" "${{ inputs.asset }}"
          ls -la "${{ inputs.asset }}"
          sha256sum "${{ inputs.asset }}"
      - name: Create or update the release
        run: |
          T="${{ inputs.title }}"; [ -n "$T" ] || T="Blaze ${{ inputs.tag }}"
          if gh release view "${{ inputs.tag }}" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "${{ inputs.tag }}" "${{ inputs.asset }}" --clobber --repo "$REPO"
          else
            if [ "${{ inputs.prerelease }}" = "true" ]; then FLAG="--prerelease --latest=false"; else FLAG="--latest"; fi
            gh release create "${{ inputs.tag }}" "${{ inputs.asset }}" --repo "$REPO" --target "${{ inputs.sha }}" --title "$T" \
              --notes "Built by Build APK run ${{ inputs.run_id }} from ${{ inputs.sha }}." $FLAG
          fi
          gh release view "${{ inputs.tag }}" --repo "$REPO" --json assets --jq '.assets[].url'
