# Local check (not the release gate) on the same low-RAM emulator as lowram-smoke.yml, with animations ON (the gate disables
# them, so it only sees the reduce-motion path), same 700 ms main-stall limit. 0.52.2: the old Home's entry sequence
# (HomeIntroCheck) is gone with the old Home. 0.52.3: this runs SpaceOnboardingCheck (ArgusSpotlightCheck left with the 3D
# Home): the new first run, welcome -> one setup screen -> Continue, three times with real taps, screenshots in
# space-onboarding/. The official gate (LowRamSmokeTest, 7 scenarios) is separate. File name kept for existing links.
name: Home intro check (ARGUS onboarding)

on:
  push:
    branches: [ "check/**", "feat/argus-3d-home", "feat/argus-hark-design" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-intro-check-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  intro:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Build debug app + test APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain "-Dorg.gradle.jvmargs=-Xmx5g -Xss8m -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.jvm.target.validation.mode=warning 2>&1 | tee build-intro.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-31-google_apis-x86_64-1536M-v1
      - name: Create AVD snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          ram-size: 1536M
          heap-size: 192M
          disk-size: 6G
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: echo "AVD snapshot generated"
      - name: Low-RAM emulator (API 31, 1.5 GB RAM, 192 MB heap), animations on
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          ram-size: 1536M
          heap-size: 192M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot-save
          force-avd-creation: false
          disable-animations: false
          script: bash tools/smoke/run-space-onboarding.sh
      - name: Summary
        if: always()
        run: cat onboarding-out/SUMMARY.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-out
          retention-days: 7
          path: |
            onboarding-out/
            app/build/outputs/apk/debug/app-debug.apk
